services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hossana
      POSTGRES_PASSWORD: hossana
      POSTGRES_DB: hossana
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hossana -d hossana"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Para Docker local se usa development: evita exigir secretos
      # "de producción" que no están en el .env de desarrollo.
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://hossana:hossana@db:5432/hossana?schema=public
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      PUBLIC_WEB_URL: http://localhost:8080
      TRUST_PROXY: "true"
      PAYMENT_PROOF_DIR: /app/uploads/payment-proofs
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3000
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
