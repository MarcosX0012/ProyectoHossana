# Blueprint de Render para Hossana.
#
# La imagen la construye y publica GitHub Actions en GHCR:
#   ghcr.io/marcosx0012/proyectohossana/hossana:latest
#
# Requisitos:
#   1. Hacer pública la imagen en GitHub Packages, o registrar
#      credenciales de GHCR en Render (Settings > Registry Credentials).
#   2. Configurar PII_ENCRYPTION_KEY (base64 de 32 bytes) y las
#      credenciales de correo en el dashboard de Render.
#   3. Configurar el deploy hook de Render como secreto
#      RENDER_DEPLOY_HOOK_URL en GitHub.
#
# Nota: Render free duerme el servicio a los 15 minutos, la base de
# datos free expira a los 30 días y el disco es efímero.

services:
  - type: web
    name: hossana
    runtime: image
    image:
      url: ghcr.io/marcosx0012/proyectohossana/hossana:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: hossana-db
          property: connectionString

      - key: HOST
        value: 0.0.0.0

      - key: TRUST_PROXY
        value: "true"

      # La imagen única sirve el React compilado desde Fastify.
      - key: SERVE_FRONTEND
        value: "true"

      - key: FRONTEND_DIST
        value: /app/public

      - key: PAYMENT_PROOF_DIR
        value: /app/uploads/payment-proofs

      # Render inyecta RENDER_EXTERNAL_URL y la app lo usa como valor
      # por defecto de CORS_ORIGINS y PUBLIC_WEB_URL. Si se usa un
      # dominio personalizado, definirlos manualmente en el dashboard.

      - key: JWT_SECRET
        generateValue: true

      - key: TRACKING_SIGNING_SECRET
        generateValue: true

      # Debe ser base64 de exactamente 32 bytes:
      #   openssl rand -base64 32
      - key: PII_ENCRYPTION_KEY
        sync: false

      # En Render free el SMTP está bloqueado. Usar un proveedor por API
      # (Resend, Brevo, etc.) cuando se active el correo.
      - key: EMAIL_ENABLED
        value: "false"

      - key: EMAIL_PROVIDER
        value: api

      - key: EMAIL_API_URL
        sync: false

      - key: EMAIL_API_KEY
        sync: false

      - key: EMAIL_FROM
        value: Hossana <no-reply@hossana.local>

      - key: COURIER_PROVIDER
        value: mock

databases:
  - name: hossana-db
    plan: free
    databaseName: hossana
    user: hossana
